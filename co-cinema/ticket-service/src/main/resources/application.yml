spring:
  application:
    name: ticket-service
  datasource:
    url: jdbc:mysql://localhost:3306/co_cinema_ticket?createDatabaseIfNotExist=True
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8090

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka